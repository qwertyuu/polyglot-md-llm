[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "polyglot-pmd"
version = "0.6.0"
description = "LLM-ready, dependency-aware polyglot Markdown notebooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PMD contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "markdown-it-py>=3.0,<5",
  "Pygments>=2.17,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[project.scripts]
pmd = "pmd_notebook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmd_notebook"]

[tool.hatch.build.targets.wheel.force-include]
"skills/polyglot-pmd/SKILL.md" = "pmd_notebook/skills/polyglot-pmd/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
  "src/pmd_notebook",
  "tests",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
  "pyproject.toml",
  "spec.md",
  "agent-spec.md",
  "example.pmd",
  "skills/polyglot-pmd/SKILL.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
