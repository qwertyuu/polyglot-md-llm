[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "polyglot-pmd"
version = "0.6.3"
description = "LLM-ready, dependency-aware polyglot Markdown notebooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "PMD contributors" }]
keywords = ["notebook", "markdown", "polyglot", "reproducibility", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "markdown-it-py>=3.0,<5",
  "Pygments>=2.17,<3",
  "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/qwertyuu/polyglot-md-llm"
Documentation = "https://github.com/qwertyuu/polyglot-md-llm#readme"
Changelog = "https://github.com/qwertyuu/polyglot-md-llm/blob/main/CHANGELOG.md"
Issues = "https://github.com/qwertyuu/polyglot-md-llm/issues"
Source = "https://github.com/qwertyuu/polyglot-md-llm"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[project.scripts]
pmd = "pmd_notebook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmd_notebook"]

[tool.hatch.build.targets.wheel.force-include]
"skills/polyglot-pmd/SKILL.md" = "pmd_notebook/skills/polyglot-pmd/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
  "src/pmd_notebook",
  "tests",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "pyproject.toml",
  "docs",
  "examples",
  "proposals",
  "skills/polyglot-pmd/SKILL.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
