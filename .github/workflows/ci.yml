name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: pmd check examples/basic.pmd --graph
      - run: pmd test examples/basic.pmd --fresh
      - run: pmd test examples/artifacts.pmd --fresh
      - run: pmd check examples/composition.pmd --strict-inputs --graph
      - run: pmd test examples/composition.pmd --fresh
      - run: pmd check examples/v0.6/notebook.pmd --graph
      - run: pmd test examples/v0.6/notebook.pmd --fresh
      - if: runner.os == 'Linux'
        run: pmd test examples/shell-context.pmd --fresh
      - if: runner.os == 'Windows'
        run: pmd test examples/powershell-context.pmd --fresh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
